name: Build Android APK

on:
  push:
    branches:
      - main # Hoặc master (Chạy build khi push code vào nhánh này)
  workflow_dispatch: # Cho phép bạn bấm nút tự động build thủ công trên web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ kho lưu trữ về máy ảo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java (Yêu cầu bắt buộc để build Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Bước 3: Cấp quyền thực thi cho bộ công cụ Gradle
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Bước 4: Tiến hành biên dịch ra file APK (Bản Debug)
      # Nếu muốn bản Release có ký chữ ký số, hãy đổi thành: ./gradlew assembleRelease
      - name: Build APK
        run: ./gradlew assembleDebug

      # Bước 5: Đưa file APK xuất ra lên hệ thống để bạn tải về
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
